<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ant Colony</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07050a;color:#d8cdb8;font:13px/1.4 system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair;touch-action:none}
  #mini{position:fixed;top:10px;right:10px;width:min(22vw,250px);image-rendering:pixelated;background:#000;
        border:1px solid #6a5a44;border-radius:3px;cursor:pointer;touch-action:none;box-shadow:0 2px 10px #0008}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:8px 14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;
       background:linear-gradient(to top,rgba(14,10,7,.95),rgba(14,10,7,.84));border-top:1px solid #3a2d20;backdrop-filter:blur(3px)}
  #hud.hidden{display:none}
  #bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center}
  #stats{display:flex;flex-wrap:wrap;gap:0 14px;justify-content:center;font-size:12px}
  #stats span{white-space:nowrap}
  b{color:#f2c94c;font-weight:600}
  #roster{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .card{display:flex;gap:8px;align-items:center;background:#201912cc;border:1px solid #3a2d20;border-radius:6px;padding:4px 10px;font-size:12px}
  .card i{width:14px;height:14px;border-radius:2px;border:1px solid #8a8070;flex:none}
  .card small{opacity:.65}
  button{background:#2a2118;color:#d8cdb8;border:1px solid #4a3a2a;border-radius:4px;padding:3px 10px;cursor:pointer;font:inherit}
  button:hover{background:#3a2d20}
  button.on{background:#5a4430;border-color:#8a6a46}
  #hint{opacity:.55;font-size:11px;text-align:center}
  #bShow{position:fixed;right:10px;bottom:10px;display:none;opacity:.85}
  #away{position:fixed;top:10px;left:50%;transform:translateX(-50%);max-width:60vw;display:none;padding:6px 14px;text-align:center;
        background:rgba(14,10,7,.92);border:1px solid #6a5a44;border-radius:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mini" title="the whole world: click or drag to move the view"></canvas>
<div id="hud">
  <div id="roster"></div>
  <div id="stats"></div>
  <div id="bar">
    <button id="bRate" title="how fast time passes">real time (T)</button>
    <button id="bPause">pause (space)</button>
    <button id="bCentre">go to the nest (C)</button>
    <button id="bZoomOut" title="zoom out">−</button>
    <button id="bZoomIn" title="zoom in">+</button>
    <button id="bFog" class="on">fog (F)</button>
    <button id="bPher">scent trails (P)</button>
    <button id="bSpiders">spiders (X)</button>
    <button id="bSpawn">summon spider (K)</button>
    <button id="bReset">new colony (R)</button>
    <button id="bFull">fullscreen (G)</button>
    <button id="bHud">hide panel (H)</button>
  </div>
  <div id="hint">one pixel is 1.6 mm, one pellet of sand &nbsp;·&nbsp; seeds: <span style="color:#f2c94c">small</span>, <span style="color:#d68a34">medium</span>, <span style="color:#b0563a">large</span> fall by themselves; left-drag above ground pours more<br>
    move: W A S D, arrows, mouse wheel (Shift for sideways), right-drag, or the map &nbsp;·&nbsp; zoom: + and −, or Ctrl + wheel</div>
</div>
<button id="bShow">show panel (H)</button>
<div id="away" role="status"></div>

<script src="js/sim.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
